# ============================================================================
# CamBus - Docker Compose
# Centro de Distribución Mabe SLP
# ============================================================================
# Orquestación de contenedores para el sistema CamBus
# ============================================================================

version: '3.8'

services:
  # Aplicación Streamlit
  cambus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cambus-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cambus_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-cambus123}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cambus-network
    volumes:
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cambus-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cambus123}
      - POSTGRES_DB=cambus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - cambus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cambus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Adminer (opcional - administración de BD via web)
  adminer:
    image: adminer:latest
    container_name: cambus-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - cambus-network
    profiles:
      - tools

networks:
  cambus-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
